<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tên game — Máy Game</title>
<meta name="theme-color" content="#101814">
<link rel="icon" href="../../assets/favicon.ico?v=1" sizes="16x16 32x32 48x48">
<link rel="icon" href="../../assets/favicon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/shared.css?v=7" />
    <link rel="stylesheet" href="./game.css" />
    <script type="module" src="./game.js"></script>
  <link rel="stylesheet" href="../../assets/css/viewport.css?v=5">
<script type="module" src="../../assets/js/game-menu.js?v=2"></script>
</head>
  <body>
    <main class="game-page arcade-game">
      <div class="arcade-case-header">
        <span class="arcade-case-brand"><span class="arcade-brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>MÁY GAME</span>
        <span class="arcade-case-lights" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <section class="arcade-screen" aria-label="Màn hình máy arcade">
        <div class="arcade-screen-meta"><a class="back-link" href="../../index.html" aria-label="Về màn hình chính">← Màn hình chính</a><h1 class="game-title">Tên game</h1><button class="game-button game-icon-button" id="game-menu-toggle" type="button" aria-label="Tạm dừng và mở menu" aria-keyshortcuts="Escape" title="Tạm dừng và mở menu (Esc)" aria-controls="game-menu" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h12"/></svg></button></div>
        <div class="arcade-game-content">
          <section class="game-panel" tabindex="-1" aria-label="Khu vực chơi game">
            <!-- Thêm canvas hoặc các nút game vào đây. -->
          </section>
        </div>
        <dialog class="game-menu" id="game-menu" aria-labelledby="game-menu-title" data-return-focus=".game-panel">
          <div class="game-menu-card">
            <header class="game-menu-header">
              <h2 id="game-menu-title">Menu trò chơi</h2>
              <button class="game-button game-button-primary" type="button" data-menu-close autofocus>Đóng menu</button>
            </header>
            <div class="game-menu-body">
              <p>Thêm trạng thái tạm dừng và cách tiếp tục tại đây.</p>
              <details>
                <summary>Cách chơi</summary>
                <p>Thêm hướng dẫn chạm và bàn phím của game tại đây.</p>
              </details>
              <!-- Thêm các nhóm Cài đặt/Ván chơi khi game có thao tác tương ứng.
                   Xử lý game-menu-open để dừng gameplay; không thêm nút pause riêng. -->
            </div>
          </div>
        </dialog>
      </section>
      <div class="arcade-deck"><span class="arcade-speaker" aria-hidden="true"></span></div>
    </main>
  </body>
</html>
