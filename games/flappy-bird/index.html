<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flappy Bird — Máy Game</title>
<meta name="theme-color" content="#101814">
<link rel="icon" href="../../assets/favicon.ico?v=1" sizes="16x16 32x32 48x48">
<link rel="icon" href="../../assets/favicon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="../../assets/typography.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="./game.css?v=3" />
    <script type="module" src="./game.js?v=4"></script>
  </head>
  <body>
    <main class="game-page flappy-page arcade-game">
      <div class="arcade-case-header">
        <span class="arcade-case-brand"><span class="arcade-brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>MÁY GAME</span>
        <span class="arcade-case-lights" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <section class="arcade-screen" aria-label="Màn hình máy arcade">
        <div class="arcade-screen-meta"><a class="back-link" href="../../index.html" aria-label="Về màn hình chính">← Màn hình chính</a></div>
        <div class="arcade-game-content">
          <div class="flappy-title-row">
            <h1 class="game-title">Flappy Bird</h1>
            <span class="sr-only" id="score" aria-live="polite">0</span>
          </div>
          <div class="flappy-controls">
            <button class="game-button game-button-primary" id="flap" type="button">Bắt đầu</button>
            <button class="game-button" id="pause" type="button">Tạm dừng</button>
          </div>
          <canvas id="flappy-board" width="288" height="512" tabindex="0" aria-label="Bảng chơi Flappy Bird. Nhấn Space hoặc mũi tên lên để vỗ cánh."></canvas>
          <p class="game-message sr-only" id="status" aria-live="polite"></p>
        </div>
      </section>
      <div class="arcade-deck"><span class="arcade-speaker" aria-hidden="true"></span></div>
    </main>
  </body>
</html>
