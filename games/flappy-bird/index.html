<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flappy Bird — Máy Game</title>
<meta name="theme-color" content="#101814">
<link rel="icon" href="../../assets/favicon.ico?v=1" sizes="16x16 32x32 48x48">
<link rel="icon" href="../../assets/favicon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/shared.css?v=3" />
    <script type="module" src="./game.js?v=11"></script>
    <script type="module" src="../../assets/js/game-menu.js?v=2"></script>
    <link rel="stylesheet" href="../../assets/css/viewport.css?v=4">
    <link rel="stylesheet" href="./game.css?v=8" />
</head>
  <body>
    <main class="game-page flappy-page arcade-game">
      <div class="arcade-case-header">
        <span class="arcade-case-brand"><span class="arcade-brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>MÁY GAME</span>
        <span class="arcade-case-lights" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <section class="arcade-screen" aria-label="Màn hình máy arcade">
        <div class="arcade-screen-meta">
          <a class="back-link" href="../../index.html" aria-label="Về màn hình chính">← Màn hình chính</a>
          <h1 class="game-title">Flappy Bird</h1>
          <button class="game-button game-icon-button" id="game-menu-toggle" type="button" aria-label="Tạm dừng và mở menu" aria-keyshortcuts="Escape" title="Tạm dừng và mở menu (Esc)" aria-controls="game-menu" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h12"/></svg></button>
        </div>
        <div class="arcade-game-content">
          <div class="flappy-board-wrap">
            <canvas id="flappy-board" width="288" height="512" tabindex="0" aria-label="Bảng chơi Flappy Bird. Nhấn Space hoặc mũi tên lên để vỗ cánh."></canvas>
            <section class="flappy-results" aria-label="Kết quả ván chơi" hidden>
              <img src="./assets/sprites/gameover.png" alt="Hết ván" width="192" height="42">
              <div class="flappy-scorecard" role="status">
                <div><span>Điểm</span><strong id="score">0</strong></div>
                <div><span>Kỷ lục</span><strong id="record">0</strong></div>
              </div>
              <div class="flappy-result-actions">
                <button class="game-button game-button-primary" id="play" type="button">Chơi lại</button>
                <button class="game-button" id="revive" type="button">Hồi sinh 1 lần</button>
              </div>

      </section>
          </div>
          <p class="game-help" id="flappy-hint" aria-live="polite">Chạm để bay · Space hoặc ↑ trên máy tính</p>
        </div>
        <dialog class="game-menu" id="game-menu" aria-labelledby="game-menu-title" data-return-focus="#flappy-board">
          <div class="game-menu-card">
            <h2 id="game-menu-title">Menu Flappy Bird</h2>
            <p>Chạm bàn chơi, Space hoặc ↑ để bay qua ống. P hoặc Esc tạm dừng; M bật/tắt âm thanh. Hồi sinh chỉ dùng một lần mỗi ván. Đóng menu rồi chạm bàn chơi để tiếp tục.</p>
            <div class="game-menu-actions">
              <button class="game-button" id="mute" type="button" aria-pressed="false">🔊 Tắt âm thanh</button>
              <button class="game-button game-button-primary" type="button" data-menu-close>Đóng menu</button>
            </div>
          </div>
        </dialog>
      </section>
      <div class="arcade-deck"><span class="arcade-speaker" aria-hidden="true"></span></div>
    </main>
  </body>
</html>
