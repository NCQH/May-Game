name: Update Pages web interface

on:
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: Successful main build with unchanged engine inputs
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate engine source build
        id: engine
        env:
          ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const fs = require('fs');
          (async () => {
            const id = process.env.ENGINE_RUN_ID;
            if (!/^\d+$/.test(id)) throw Error('Invalid build run ID');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}});
            if (!response.ok) throw Error('Cannot read source build');
            const run = await response.json();
            if (run.conclusion !== 'success' || run.head_branch !== 'main' || run.path !== '.github/workflows/pvz-build.yml') throw Error('A successful main engine build is required');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${run.head_sha}\n`);
          })().catch(error => {console.error(error.message); process.exit(1);});
          JS
      - name: Require identical engine inputs
        env:
          ENGINE_SHA: ${{ steps.engine.outputs.sha }}
        run: git diff --exit-code "$ENGINE_SHA" HEAD -- scripts/pvz scripts/patch-pvz.cjs scripts/patch-pvz-widescreen.cjs scripts/build-pvz.sh .github/workflows/pvz-build.yml
      - uses: actions/download-artifact@v4
        with:
          name: may-game-pvz-goty-site
          run-id: ${{ inputs.engine_run_id }}
          github-token: ${{ github.token }}
          path: .site
      - name: Overlay current web files
        run: |
          git archive HEAD | tar -x -C .site
          touch .site/.nojekyll
          mkdir -p .source-overlay/MayGame/games/pvz-goty
          cp games/pvz-goty/quality.js games/pvz-goty/index.html .source-overlay/MayGame/games/pvz-goty/
          (cd .source-overlay && zip -u ../.site/games/pvz-goty/engine/source.zip MayGame/games/pvz-goty/quality.js MayGame/games/pvz-goty/index.html)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
