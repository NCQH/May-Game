name: Deploy Bang Bang

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/bangbang/**'
      - 'scripts/bangbang/**'
      - 'sw.js'
      - '.github/workflows/bangbang.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-bangbang
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build artifact
        run: bash scripts/bangbang/build-site.sh
      - name: Install E2E dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: PvE all-map asset check
        run: node games/bangbang/html5/static-server/engine/pve-all-maps.test.js
      - name: Browser smoke
        run: node games/bangbang/html5/static-server/perf/smoke.cjs
      - name: Legacy save migration E2E
        run: node games/bangbang/html5/static-server/perf/migrate-e2e.cjs
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/bangbang/deploy.sh may-game-bangbang
      - name: Prune old deployments
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-prune-deployments.cjs may-game-bangbang 2
